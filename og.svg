<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D2E5A"/>
      <stop offset="100%" stop-color="#0a1f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C5CAA"/>
      <stop offset="100%" stop-color="#0D2E5A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#C8281E"/>

  <!-- Decorative geometric shapes (brand language) -->
  <polygon points="900,0 1200,0 1200,630 900,630" fill="#1C5CAA" opacity="0.08"/>
  <polygon points="1000,0 1200,0 1200,400" fill="#C8281E" opacity="0.06"/>

  <!-- KN Logo mark -->
  <g transform="translate(80, 220)">
    <rect width="140" height="140" rx="22" fill="#1C5CAA"/>
    <polygon points="88,24 130,70 88,116" fill="#C8281E"/>
    <polygon points="18,24 60,24 96,70 60,116 18,116 54,70" fill="#D0D2D6"/>
  </g>

  <!-- App name -->
  <text x="250" y="282" font-family="'Inter','Arial',sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">KN PeopleBase</text>

  <!-- Tagline -->
  <text x="252" y="332" font-family="'Inter','Arial',sans-serif" font-size="24" font-weight="400" fill="#7BB8F0" letter-spacing="0.5">Employee &amp; Vendor Registry · KneuralLabs</text>

  <!-- Divider -->
  <rect x="80" y="372" width="620" height="2" fill="#1C5CAA" opacity="0.5"/>

  <!-- Brand badges -->
  <rect x="80" y="400" width="180" height="36" rx="6" fill="#1C5CAA" opacity="0.3"/>
  <text x="170" y="424" font-family="'Inter','Arial',sans-serif" font-size="13" font-weight="700" fill="#7BB8F0" text-anchor="middle" letter-spacing="1">NIST AI RMF</text>

  <rect x="275" y="400" width="190" height="36" rx="6" fill="#1C5CAA" opacity="0.3"/>
  <text x="370" y="424" font-family="'Inter','Arial',sans-serif" font-size="13" font-weight="700" fill="#7BB8F0" text-anchor="middle" letter-spacing="1">ISO/IEC 42001</text>

  <rect x="480" y="400" width="160" height="36" rx="6" fill="#C8281E" opacity="0.3"/>
  <text x="560" y="424" font-family="'Inter','Arial',sans-serif" font-size="13" font-weight="700" fill="#F08080" text-anchor="middle" letter-spacing="1">EU AI ACT</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="'Inter','Arial',sans-serif" font-size="20" font-weight="600" fill="#4A8BC8" text-anchor="end" opacity="0.7">db.kneuralabs.com</text>
</svg>
